[project]
name = "spininfer"
version = "0.1.0"
description = "Inverse Ising/Potts model fitting via pseudolikelihood and moment matching, with numpy/numba/cupy/jax backends."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mark Schuttelaars", email = "mark.r.schuttelaars@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "pandas>=2.0",
]

[project.optional-dependencies]
gpu = ["cupy>=12.0"]
jax = ["jax>=0.4", "jaxlib>=0.4"]
plots = ["matplotlib>=3.7"]
msa = ["biopython>=1.81"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["backend*", "convergence*", "models*", "data*", "optimizers*", "objectives*", "fitters*", "stats*", "mean_field*"]
exclude = ["tests*"]